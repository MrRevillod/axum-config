[workspace]
resolver = "2"
members = [
    "thisconfig",
    "thisconfig-macros",
    "examples",
]

[workspace.dependencies]
thisconfig = { path = "thisconfig", version = "0.3.0" }
thisconfig-macros = { path = "thisconfig-macros", version = "0.3.0" }

tracing = { version = "0.1.44" }
serde = { version = "1.0.228", features = ["derive"] }
